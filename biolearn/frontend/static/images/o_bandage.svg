<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="chromGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plasmid1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#276749;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plasmid2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c05621;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plasmid3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9f7aea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b46c1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#1a202c"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Bandage Assembly Graph - K. pneumoniae</text>

  <!-- Main chromosome component (fragmented/linear with dead ends) -->
  <g id="chromosome">
    <!-- Contig segments -->
    <path d="M 80 280 Q 150 200, 220 240" stroke="url(#chromGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 220 240 Q 280 270, 340 230" stroke="url(#chromGrad)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M 340 230 Q 400 200, 460 250" stroke="url(#chromGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 460 250 Q 520 290, 580 260" stroke="url(#chromGrad)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 580 260 Q 640 240, 700 280" stroke="url(#chromGrad)" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- Branch segment (dead end) -->
    <path d="M 340 230 Q 320 170, 280 140" stroke="url(#chromGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- Another branch (dead end) -->
    <path d="M 460 250 Q 480 310, 520 350" stroke="url(#chromGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Dead end markers -->
    <circle cx="80" cy="280" r="6" fill="#fc8181"/>
    <circle cx="700" cy="280" r="6" fill="#fc8181"/>
    <circle cx="280" cy="140" r="5" fill="#fc8181"/>
    <circle cx="520" cy="350" r="5" fill="#fc8181"/>
  </g>

  <!-- Plasmid 1 (ColRNAI - 5.4 kb) - circular -->
  <g id="plasmid1">
    <circle cx="180" cy="480" r="45" stroke="url(#plasmid1)" stroke-width="12" fill="none"/>
    <text x="180" y="485" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="10">ColRNAI</text>
    <text x="180" y="498" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="8">5.4 kb</text>
  </g>

  <!-- Plasmid 2 (Col(pHAD28) - 4.3 kb) - circular -->
  <g id="plasmid2">
    <circle cx="320" cy="490" r="38" stroke="url(#plasmid2)" stroke-width="10" fill="none"/>
    <text x="320" y="493" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="9">pHAD28</text>
    <text x="320" y="505" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="8">4.3 kb</text>
  </g>

  <!-- Plasmid 3 (Col156 - 2.5 kb) - circular -->
  <g id="plasmid3">
    <circle cx="440" cy="500" r="30" stroke="url(#plasmid3)" stroke-width="8" fill="none"/>
    <text x="440" y="503" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="9">Col156</text>
    <text x="440" y="514" text-anchor="middle" fill="#a0aec0" font-family="Arial, sans-serif" font-size="7">2.5 kb</text>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(580, 420)">
    <rect x="0" y="0" width="190" height="150" fill="#2d3748" rx="8"/>
    <text x="95" y="22" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Legend</text>

    <line x1="15" y1="42" x2="45" y2="42" stroke="#4a90d9" stroke-width="6" stroke-linecap="round"/>
    <text x="55" y="46" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="10">Chromosome (linear)</text>

    <circle cx="30" cy="68" r="12" stroke="#48bb78" stroke-width="4" fill="none"/>
    <text x="55" y="72" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="10">Plasmid (circular)</text>

    <circle cx="30" cy="94" r="5" fill="#fc8181"/>
    <text x="55" y="98" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="10">Dead end</text>

    <line x1="10" y1="115" x2="180" y2="115" stroke="#4a5568" stroke-width="1"/>

    <text x="15" y="132" fill="#a0aec0" font-family="Arial, sans-serif" font-size="9">Components: 4</text>
    <text x="15" y="145" fill="#a0aec0" font-family="Arial, sans-serif" font-size="9">Dead ends: 6</text>
  </g>

  <!-- Node count label -->
  <text x="400" y="570" text-anchor="middle" fill="#718096" font-family="Arial, sans-serif" font-size="11">189 nodes | 243 edges | Generated by Bandage v0.8.1</text>
</svg>
